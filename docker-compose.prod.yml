services:
  library-api:
    image: ${IMAGE_PREFIX:-ghcr.io/staljabro/stage-layout-app}-library-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - ${LIBRARY_DATA_PATH}/equipment-library:/data/equipment-library
      - ${LIBRARY_DATA_PATH}/stage-library:/data/stage-library
    networks:
      - internal

  stageplot:
    image: ${IMAGE_PREFIX:-ghcr.io/staljabro/stage-layout-app}-stageplot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - library-api
    ports:
      - "${STAGEPLOT_PORT:-8088}:80"
    networks:
      - internal

  studio:
    image: ${IMAGE_PREFIX:-ghcr.io/staljabro/stage-layout-app}-studio:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - library-api
    ports:
      - "${STUDIO_BIND:-0.0.0.0}:${STUDIO_PORT:-8089}:80"
    networks:
      - internal

networks:
  internal:
