services:
  library-api:
    build:
      context: .
      target: library-api
    restart: unless-stopped
    volumes:
      - ${LIBRARY_DATA_PATH:-.}/equipment-library:/data/equipment-library
      - ${LIBRARY_DATA_PATH:-.}/stage-library:/data/stage-library
      - ${LIBRARY_DATA_PATH:-.}/account-data:/data/account-data
    environment:
      STAGEPLOT_SECURE_COOKIE: ${STAGEPLOT_SECURE_COOKIE:-false}
      STAGEPLOT_ALLOWED_ORIGINS: ${STAGEPLOT_ALLOWED_ORIGINS:-}
      STAGEPLOT_GITHUB_CLIENT_ID: ${STAGEPLOT_GITHUB_CLIENT_ID:-}
      STAGEPLOT_GITHUB_CLIENT_SECRET: ${STAGEPLOT_GITHUB_CLIENT_SECRET:-}
      STAGEPLOT_GITHUB_CALLBACK_URL: ${STAGEPLOT_GITHUB_CALLBACK_URL:-}
      STAGEPLOT_APP_URL: ${STAGEPLOT_APP_URL:-}
      STAGEPLOT_STUDIO_URL: ${STAGEPLOT_STUDIO_URL:-}
      STAGEPLOT_GITHUB_OWNER_ID: ${STAGEPLOT_GITHUB_OWNER_ID:-}
      STAGEPLOT_OWNER_USER_ID: ${STAGEPLOT_OWNER_USER_ID:-}
    networks:
      - internal

  stageplot:
    build:
      context: .
      target: stageplot
    restart: unless-stopped
    depends_on:
      - library-api
    ports:
      - "${STAGEPLOT_PORT:-8088}:80"
    networks:
      - internal

  studio:
    build:
      context: .
      target: studio
    restart: unless-stopped
    depends_on:
      - library-api
    ports:
      - "${STUDIO_BIND:-0.0.0.0}:${STUDIO_PORT:-8089}:80"
    networks:
      - internal

networks:
  internal:
