name: Build and publish containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_version: ${{ steps.version.outputs.publish_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read release version from src/version.js
        id: version
        run: node tools/release-version.mjs --github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: npm run lint
      - name: Build Stageplot
        run: npm run build
      - name: Run application and API tests
        timeout-minutes: 5
        shell: bash
        run: |
          mapfile -d '' tests < <(find tools -maxdepth 1 -name '*.test.mjs' ! -name '*browser.test.mjs' ! -name 'popup-layout.test.mjs' -print0)
          node --test --test-isolation=none --test-reporter=tap src/*.test.js "${tests[@]}"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: stageplot
            target: stageplot
          - name: library-api
            target: library-api
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.publish_version == 'true' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    needs: [verify, publish]
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.publish_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          IS_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        shell: bash
        run: |
          options=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Stageplot $RELEASE_VERSION" --generate-notes "${options[@]}"
